<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Server Monitor</title>
</head>
<body>

    <header class="header">
        <h1 class="header__title">Server Monitor</h1>
        <button id="btn-theme" class="btn btn--theme" aria-label="Сменить тему">темная</button>
    </header>

    <main class="main">

        <section class="connect-section">
            <h2 class="section-title">Подключение к серверу</h2>

            <div class="connect-form">
                <div class="field">
                    <label for="host">Имя хоста</label>
                    <input type="text" id="host" value="localhost" placeholder="192.168.xxx.xxx">
                </div>

                <div class="field">
                    <label for="port">Порт</label>
                    <input type="number" id="port" value="2222" placeholder="2222">
                </div>

                <div class="field">
                    <label for="username">Имя пользователя</label>
                    <input type="text" id="username" value="student" placeholder="root">
                </div>

                <div class="field">
                    <label for="password">Пароль</label>
                    <input type="password" id="password" value="student123" placeholder="********">
                </div>

                <button id="btn-connect" class="btn btn--primary">Подключиться</button>

                <p id="status" class="status">Не подключено</p>
            </div>
        </section>

        <section class="metrics-section">
            <h2 class="section-title">Метрики</h2>
            <div id="metrics" class="metrics">
                
            </div>
        </section>

        <section class="charts-section">
            <h2 class="section-title">Графики</h2>
            <div class="charts">
                <div class="chart-container">
                    <h3 class="chart-title">CPU</h3>
                    <canvas id="chart-cpu"></canvas>
                </div>
                <div class="chart-container">
                    <h3 class="chart-title">RAM</h3>
                    <canvas id="chart-ram"></canvas>
                </div>
            </div>
        </section>

        <section class="command-section">
            <h2 class="section-title">Выполнить команду</h2>

            <div class="command-form">
                <input type="text" id="command" value="echo HelloWorld" placeholder="uptime, whoami, ls">
                <button id="btn-command" class="btn btn--primary">Отправить</button>
            </div>

            <pre id="output" class="output">Вывод команды появится здесь...</pre>
        </section>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="renderer.js"></script>

</body>
</html>
